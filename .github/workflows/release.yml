name: Release

# Builds and publishes installers to a GitHub Release whenever a version
# tag (v1.2.3) is pushed.
#
# Windows-only for now. To bring macOS back in once the Apple signing
# secrets (see README "Distributing to non-technical users") are set up,
# change the matrix below to:
#   os: [macos-latest, windows-latest]
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      # No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD env vars here on purpose: an
      # unset GitHub secret resolves to an empty string rather than being
      # absent, and electron-builder treats a *present but empty*
      # WIN_CSC_LINK as "resolve this empty string as a certificate file
      # path" rather than "no signing" — which fails the build outright.
      # Once you have a Windows code signing cert, add both lines back
      # under `env:` below (see README "Distributing to non-technical
      # users" for what they should be).
      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
