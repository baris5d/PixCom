name: Release

# Builds and publishes installers to a GitHub Release whenever a version
# tag (v1.2.3) is pushed. macOS build is code-signed and notarized (Apple
# secrets below); Windows build is unsigned unless WIN_CSC_LINK/
# WIN_CSC_KEY_PASSWORD secrets are also added (see README "Distributing to
# non-technical users").
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Without this, GitHub Actions cancels the other platform's still-running
      # job the moment either one fails — a mac signing hiccup shouldn't take
      # down an otherwise-fine Windows build, and vice versa.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Both platforms publish to the SAME GitHub Release for this tag.
    # electron-builder's publish step isn't safe to run concurrently against
    # one release (it can create/finalize the release object itself, and two
    # of those racing can silently drop whichever platform's assets lost the
    # race) — this group is identical across the matrix (no matrix.os in the
    # key) so the two jobs queue one after another instead of running at once.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      # Split by OS (rather than one step with every env var) so the mac
      # signing vars are never even present in the Windows job's
      # environment — electron-builder can fall back to a shared CSC_LINK
      # across platforms if a platform-specific one is absent, and mixing
      # them up would mean signing the Windows exe with a macOS cert.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD here on purpose: an unset
      # GitHub secret resolves to an empty string rather than being
      # absent, and electron-builder treats a *present but empty*
      # WIN_CSC_LINK as "resolve this empty string as a certificate file
      # path" rather than "no signing" — which fails the build outright.
      # Once you have a Windows code signing cert, add both under `env:`
      # below (see README for what they should be).
      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder's GitHub publish step is supposed to find and reuse an
  # existing release for the tag, but in practice this repo has seen it
  # create a *second* release for the same tag instead — sometimes from one
  # job retrying after a transient upload failure (stranding whatever had
  # already uploaded on the abandoned release), sometimes from the mac and
  # Windows jobs each ending up on their own release entirely (each one
  # complete for its own platform, missing the other's files). Picking
  # "whichever release has the most assets" and deleting the rest — the
  # previous version of this job — gets the second case backwards: it can
  # keep the mac-only release and delete the one holding the Windows exe,
  # or vice versa. Merge every asset from every duplicate onto one release
  # instead, so nothing is ever lost regardless of which job created what.
  cleanup-duplicate-releases:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Merge duplicate releases for this tag into one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          ids=$(gh api "repos/${repo}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id")

          count=$(echo "$ids" | grep -c . || true)
          if [ "$count" -le 1 ]; then
            echo "Only $count release(s) for $tag — nothing to merge."
            exit 0
          fi

          keeper_id=$(echo "$ids" | head -n1)
          echo "Found $count releases for $tag — merging all assets onto $keeper_id."

          workdir=$(mktemp -d)
          for id in $ids; do
            if [ "$id" = "$keeper_id" ]; then continue; fi

            keeper_names=$(gh api "repos/${repo}/releases/${keeper_id}/assets" --jq '.[].name')

            gh api "repos/${repo}/releases/${id}/assets" --jq '.[] | "\(.name)\t\(.browser_download_url)"' \
              | while IFS=$'\t' read -r asset_name download_url; do
                  if grep -qxF "$asset_name" <<< "$keeper_names"; then
                    echo "  skip ${asset_name} (already on ${keeper_id})"
                    continue
                  fi
                  echo "  moving ${asset_name} from ${id} to ${keeper_id}"
                  curl -sL -o "${workdir}/${asset_name}" "$download_url"
                  gh release upload "$tag" "${workdir}/${asset_name}" --repo "${repo}" --clobber
                  rm -f "${workdir}/${asset_name}"
                done
          done

          for id in $ids; do
            if [ "$id" != "$keeper_id" ]; then
              echo "Deleting now-merged release $id"
              gh api -X DELETE "repos/${repo}/releases/${id}"
            fi
          done
