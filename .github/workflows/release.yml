name: Release

# Builds and publishes installers to a GitHub Release whenever a version
# tag (v1.2.3) is pushed. macOS build is code-signed and notarized (Apple
# secrets below); Windows build is unsigned unless WIN_CSC_LINK/
# WIN_CSC_KEY_PASSWORD secrets are also added (see README "Distributing to
# non-technical users").
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Without this, GitHub Actions cancels the other platform's still-running
      # job the moment either one fails — a mac signing hiccup shouldn't take
      # down an otherwise-fine Windows build, and vice versa.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Both platforms publish to the SAME GitHub Release for this tag.
    # electron-builder's publish step isn't safe to run concurrently against
    # one release (it can create/finalize the release object itself, and two
    # of those racing can silently drop whichever platform's assets lost the
    # race) — this group is identical across the matrix (no matrix.os in the
    # key) so the two jobs queue one after another instead of running at once.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      # Split by OS (rather than one step with every env var) so the mac
      # signing vars are never even present in the Windows job's
      # environment — electron-builder can fall back to a shared CSC_LINK
      # across platforms if a platform-specific one is absent, and mixing
      # them up would mean signing the Windows exe with a macOS cert.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD here on purpose: an unset
      # GitHub secret resolves to an empty string rather than being
      # absent, and electron-builder treats a *present but empty*
      # WIN_CSC_LINK as "resolve this empty string as a certificate file
      # path" rather than "no signing" — which fails the build outright.
      # Once you have a Windows code signing cert, add both under `env:`
      # below (see README for what they should be).
      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder uploads release assets one at a time, and a transient
  # failure partway through an upload (seen in practice with the large
  # macOS .dmg) makes it abandon the release object it already created and
  # start over — creating a second release for the same tag, with whatever
  # had uploaded before the retry stranded on the first one. Both `release`
  # matrix jobs already reuse a single release correctly when they succeed
  # cleanly; this only cleans up the rarer per-job retry-duplicate case,
  # instead of requiring someone to notice and delete it by hand.
  cleanup-duplicate-releases:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the release with the most assets for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id")

          count=$(echo "$ids" | grep -c . || true)
          if [ "$count" -le 1 ]; then
            echo "Only $count release(s) for $tag — nothing to clean up."
            exit 0
          fi

          echo "Found $count releases for $tag — keeping the one with the most assets."
          best_id=""
          best_count=-1
          for id in $ids; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --jq 'length')
            echo "  release $id has $n asset(s)"
            if [ "$n" -gt "$best_count" ]; then
              best_count="$n"
              best_id="$id"
            fi
          done

          echo "Keeping release $best_id ($best_count assets); deleting the rest."
          for id in $ids; do
            if [ "$id" != "$best_id" ]; then
              echo "Deleting duplicate release $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            fi
          done
