name: Release

# Builds and publishes installers to a GitHub Release whenever a version
# tag (v1.2.3) is pushed.
#
# Windows-only for now. To bring macOS back in once the Apple signing
# secrets (see README "Distributing to non-technical users") are set up,
# change the matrix below to:
#   os: [macos-latest, windows-latest]
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Windows code signing — omit these secrets to ship an
          # unsigned .exe; recipients will see a one-time SmartScreen
          # "unknown publisher" warning (click "More info" -> "Run anyway").
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
