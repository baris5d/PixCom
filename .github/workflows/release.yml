name: Release

# Builds and publishes installers to a GitHub Release whenever a version
# tag (v1.2.3) is pushed. macOS build is code-signed and notarized (Apple
# secrets below); Windows build is unsigned unless WIN_CSC_LINK/
# WIN_CSC_KEY_PASSWORD secrets are also added (see README "Distributing to
# non-technical users").
#
# Build and publish are deliberately separate jobs: each platform job only
# builds (electron-builder locally, never --publish), uploads its installer
# as a plain GitHub Actions artifact, and a single final job creates the
# release with everything via `gh release create`. Two platform jobs each
# calling electron-builder's own --publish against the same release
# repeatedly dropped assets (whichever ran second sometimes uploaded
# nothing, or only partially) no matter how the jobs were serialized —
# this sidesteps that flakiness entirely by only ever creating the release
# once, with every file already in hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Build (macOS)
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      # No WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD here on purpose: an unset
      # GitHub secret resolves to an empty string rather than being
      # absent, and electron-builder treats a *present but empty*
      # WIN_CSC_LINK as "resolve this empty string as a certificate file
      # path" rather than "no signing" — which fails the build outright.
      # Once you have a Windows code signing cert, add both under `env:`
      # below (see README for what they should be).
      - name: Build (Windows)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete-then-create so re-running this workflow for a tag that
          # already has a (possibly broken, from a prior flaky run) release
          # just replaces it cleanly instead of failing with "already exists".
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
          gh release create "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
